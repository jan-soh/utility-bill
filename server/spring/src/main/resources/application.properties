spring.application.name=utility-bill
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/utility_bill?useUnicode=true&characterEndcoding=UTF-8&serverTimezone=UTC
spring.jpa.database=mysql
