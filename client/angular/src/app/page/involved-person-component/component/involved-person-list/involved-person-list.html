<h2>Involved persons</h2>

<div style="height: 30px"></div>

<div class="overflow-x-auto shadow-md sm:rounded-lg">

  @if (store.hasError()) {
    <div class="error-message">
      {{ store.error() }}
    </div>
  }

  <table class="w-full text-sm text-left text-gray-500">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
    <tr>
      <th scope="col" class="px-6 py-3">
        Name
      </th>
      <th scope="col" class="px-6 py-3">
        Start of involvement
      </th>
      <th scope="col" class="px-6 py-3">
        End of involvement
      </th>
      <th scope="col" class="px-6 py-3">
        Actions
      </th>
    </tr>
    </thead>
    <tbody>
      @for (person of store.persons(); track person.id) {

        <tr class="bg-white border-b hover:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">{{ person.name }}</td>
          <td class="px-6 py-4">{{ person.startOfInvolvement }}</td>
          <td class="px-6 py-4">{{ person.endOfInvolvement }}</td>
          <td class="px-6 py-4">
            <button class="tab-button edit-button" (click)="edit(person)">Edit</button>
            <button class="tab-button delete-button" (click)="delete(person)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
