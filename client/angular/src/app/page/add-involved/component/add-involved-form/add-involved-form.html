<h2>Add a new involved person</h2>
<div class="form-container">
  <div class="form-group">
    <label for="name">Name:</label>
    <input id="name" type="text" [(ngModel)]="involvedPerson().name" (ngModelChange)="reset()"/>
  </div>

  <div class="form-group">
    <label for="start-of-involvement">Start of involvement:</label>
    <input id="start-of-involvement" type="date" [(ngModel)]="involvedPerson().startOfInvolvement"
           (ngModelChange)="reset()"/>
  </div>

  <div class="form-group">
    <label for="end-of-involvement">End of involvement:</label>
    <input id="end-of-involvement" type="date" [(ngModel)]="involvedPerson().endOfInvolvement"
           (ngModelChange)="reset()"/>
  </div>

  <div class="form-group">
    <label for="utility-cost-payments-per-month-amount">Utility cost payments per month (amount of money):</label>
    <input id="utility-cost-payments-per-month-amount" type="text" [(ngModel)]="utilityCostPaymentsPerMonth().amount"
           (ngModelChange)="reset()"/>
  </div>
  <div class="form-group">
    <label for="utility-cost-payments-per-month-valid-from">Start of utility cost payments:</label>
    <input id="utility-cost-payments-per-month-valid-from" type="date"
           [(ngModel)]="utilityCostPaymentsPerMonth().validFrom" (ngModelChange)="reset()"/>
  </div>
  <div class="form-group">
    <label for="utility-cost-payments-per-month-valid-to">Start of utility cost payments:</label>
    <input id="utility-cost-payments-per-month-valid-to" type="date" [(ngModel)]="utilityCostPaymentsPerMonth().validTo"
           (ngModelChange)="reset()"/>
  </div>
  <div class="button-group">
    <button class="save-button" (click)="save()">Save</button>
  </div>

  <div *ngIf="error()" class="error-message">
    {{ error() }}
  </div>
  <div *ngIf="actionMessage()" class="action-message">
    {{ actionMessage() }}
  </div>
</div>
